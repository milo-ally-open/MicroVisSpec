user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Auth subrequests are GET requests, while the original request line is
    # preserved in subrequests. Extract the original verb so auth-service
    # still enforces CSRF for writes and WHEP signalling.
    map $request $original_method {
        default __invalid__;
        ~^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)\s $1;
    }

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 8m;

    server {
        listen 80 default_server;
        server_name _;
        return 308 https://$host:__WEB_HTTPS_PORT__$request_uri;
    }

    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate /run/secrets/nginx_tls_certificate;
        ssl_certificate_key /run/secrets/nginx_tls_private_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 10m;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;

        root /usr/share/nginx/html;
        index index.html;

        location = /_auth {
            internal;
            proxy_pass http://auth-service:8080/internal/v1/sessions/validate;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-CSRF-Token $http_x_csrf_token;
            proxy_set_header X-Original-Method $original_method;
            proxy_set_header X-Original-Origin $http_origin;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Account-ID "";
            proxy_set_header X-Session-ID "";
            include /run/secrets/nginx_auth_header_config;
        }

        location = /_media_auth {
            internal;
            proxy_pass http://media-service:8080/internal/v1/media/authorize-playback;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-CSRF-Token $http_x_csrf_token;
            proxy_set_header X-Original-Method $original_method;
            proxy_set_header X-Original-Origin $http_origin;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Internal-Service "nginx";
            proxy_set_header X-Account-ID "";
            proxy_set_header X-Session-ID "";
            proxy_set_header X-Request-ID $request_id;
            include /run/secrets/nginx_media_header_config;
        }

        location = /api/v1/auth/register {
            proxy_pass http://auth-service:8080;
            proxy_set_header X-Account-ID "";
            proxy_set_header X-Session-ID "";
            include /etc/nginx/snippets/proxy-common.conf;
        }
        location = /api/v1/auth/login {
            proxy_pass http://auth-service:8080;
            proxy_set_header X-Account-ID "";
            proxy_set_header X-Session-ID "";
            include /etc/nginx/snippets/proxy-common.conf;
        }
        location = /api/v1/auth/logout {
            proxy_pass http://auth-service:8080;
            proxy_set_header X-Account-ID "";
            proxy_set_header X-Session-ID "";
            include /etc/nginx/snippets/proxy-common.conf;
        }
        location ^~ /api/v1/auth/ {
            proxy_pass http://auth-service:8080;
            proxy_set_header X-Account-ID "";
            proxy_set_header X-Session-ID "";
            include /etc/nginx/snippets/proxy-common.conf;
        }
        location = /api/v1/push/vapid-public-key {
            proxy_pass http://push-service:8080;
            proxy_set_header X-Account-ID "";
            proxy_set_header X-Session-ID "";
            include /etc/nginx/snippets/proxy-common.conf;
        }

        location = /api/v1/devices {
            auth_request /_auth;
            auth_request_set $auth_account_id $upstream_http_x_account_id;
            auth_request_set $auth_session_id $upstream_http_x_session_id;
            proxy_set_header X-Account-ID $auth_account_id;
            proxy_set_header X-Session-ID $auth_session_id;
            proxy_pass http://device-service:8080;
            include /etc/nginx/snippets/proxy-common.conf;
        }
        location ^~ /api/v1/devices/ {
            auth_request /_auth;
            auth_request_set $auth_account_id $upstream_http_x_account_id;
            auth_request_set $auth_session_id $upstream_http_x_session_id;
            proxy_set_header X-Account-ID $auth_account_id;
            proxy_set_header X-Session-ID $auth_session_id;
            proxy_pass http://device-service:8080;
            include /etc/nginx/snippets/proxy-common.conf;
        }
        location = /api/v1/events {
            auth_request /_auth;
            auth_request_set $auth_account_id $upstream_http_x_account_id;
            auth_request_set $auth_session_id $upstream_http_x_session_id;
            proxy_set_header X-Account-ID $auth_account_id;
            proxy_set_header X-Session-ID $auth_session_id;
            proxy_pass http://event-service:8080;
            include /etc/nginx/snippets/proxy-common.conf;
        }
        location ^~ /api/v1/events/ {
            auth_request /_auth;
            auth_request_set $auth_account_id $upstream_http_x_account_id;
            auth_request_set $auth_session_id $upstream_http_x_session_id;
            proxy_set_header X-Account-ID $auth_account_id;
            proxy_set_header X-Session-ID $auth_session_id;
            proxy_pass http://event-service:8080;
            include /etc/nginx/snippets/proxy-common.conf;
        }
        location ^~ /api/v1/media/ {
            auth_request /_auth;
            auth_request_set $auth_account_id $upstream_http_x_account_id;
            auth_request_set $auth_session_id $upstream_http_x_session_id;
            proxy_set_header X-Account-ID $auth_account_id;
            proxy_set_header X-Session-ID $auth_session_id;
            proxy_pass http://media-service:8080;
            include /etc/nginx/snippets/proxy-common.conf;
        }
        location ^~ /api/v1/push/ {
            auth_request /_auth;
            auth_request_set $auth_account_id $upstream_http_x_account_id;
            auth_request_set $auth_session_id $upstream_http_x_session_id;
            proxy_set_header X-Account-ID $auth_account_id;
            proxy_set_header X-Session-ID $auth_session_id;
            proxy_pass http://push-service:8080;
            include /etc/nginx/snippets/proxy-common.conf;
        }

        location = /edge/v1/activate {
            proxy_pass http://device-service:8080;
            proxy_set_header X-Account-ID "";
            proxy_set_header X-Session-ID "";
            include /etc/nginx/snippets/proxy-common.conf;
        }
        location ~ ^/edge/v1/devices/[0-9a-fA-F-]{36}/activation$ {
            limit_except GET { deny all; }
            proxy_pass http://device-service:8080;
            proxy_set_header X-Account-ID "";
            proxy_set_header X-Session-ID "";
            proxy_set_header Authorization $http_authorization;
            include /etc/nginx/snippets/proxy-common.conf;
        }
        location ~ ^/edge/v1/devices/[^/]+/events/[^/]+/evidence$ {
            proxy_pass http://event-service:8080;
            proxy_request_buffering off;
            proxy_set_header X-Account-ID "";
            proxy_set_header X-Session-ID "";
            include /etc/nginx/snippets/proxy-common.conf;
        }

        location ~ "^/media/([0-9a-fA-F-]{36})/whep$" {
            auth_request /_media_auth;
            rewrite "^/media/([0-9a-fA-F-]{36})/whep$" /$1/whep break;
            proxy_pass http://host.docker.internal:8889;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header Cookie "";
            proxy_set_header X-Account-ID "";
            proxy_set_header X-Session-ID "";
            include /run/secrets/nginx_mediamtx_reader_header_config;
            proxy_redirect ~^(/[^/]+/whep/.*)$ /media$1;
        }
        location /media/ {
            auth_request /_media_auth;
            absolute_redirect off;
            proxy_pass http://host.docker.internal:8888/;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_set_header Cookie "";
            proxy_set_header X-Account-ID "";
            proxy_set_header X-Session-ID "";
            include /run/secrets/nginx_mediamtx_reader_header_config;
            # MediaMTX redirects the master playlist for its cookie check.
            # Preserve the protected prefix and the browser's external port.
            proxy_redirect ~^(/[^/]+/.*)$ /media$1;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
        location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
        location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
    }

    server {
        listen 8081;
        server_name localhost;
        access_log off;
        location = /_health { return 200 "ok\n"; }
        location / { return 404; }
    }
}
