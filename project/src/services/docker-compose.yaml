name: ${COMPOSE_PROJECT_NAME:-yunshao}

services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yunshao}
      POSTGRES_USER: ${POSTGRES_USER:-yunshao_bootstrap}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - postgres_admin_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks: [backend]

  database-bootstrap:
    image: postgres:17.11-alpine3.24
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-yunshao}
      PGUSER: ${POSTGRES_USER:-yunshao_bootstrap}
      POSTGRES_ADMIN_PASSWORD_FILE: /run/secrets/postgres_admin_password
      AUTH_DB_PASSWORD_FILE: /run/secrets/auth_database_password
      DEVICE_DB_PASSWORD_FILE: /run/secrets/device_database_password
      EVENT_DB_PASSWORD_FILE: /run/secrets/event_database_password
      MEDIA_DB_PASSWORD_FILE: /run/secrets/media_database_password
      PUSH_DB_PASSWORD_FILE: /run/secrets/push_database_password
    secrets:
      - postgres_admin_password
      - auth_database_password
      - device_database_password
      - event_database_password
      - media_database_password
      - push_database_password
    volumes:
      - ./auth-service/database-bootstrap.sh:/bootstrap/bootstrap.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    ports:
      - "${MQTT_BIND_ADDRESS:-127.0.0.1}:${MQTT_TLS_PORT:-8883}:8883/tcp"
    secrets:
      - mqtt_admin_password
      - mosquitto_ctrl_options
      - mqtt_ca_certificate
      - mqtt_tls_certificate
      - mqtt_tls_private_key
    volumes:
      - ./device-service/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_ctrl -o /run/secrets/mosquitto_ctrl_options -i yunshao-broker-health dynsec listClients >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [backend]

  broker-bootstrap:
    image: eclipse-mosquitto:2.1.2-alpine
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap.sh"]
    secrets:
      - mqtt_admin_password
      - mqtt_ca_certificate
      - mqtt_device_service_password
      - mqtt_event_service_password
      - mosquitto_ctrl_options
    volumes:
      - ./device-service/bootstrap-mqtt.sh:/bootstrap/bootstrap.sh:ro
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL_FILE: /run/secrets/auth_database_url
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in project/src/services/.env}
      AUTH_COOKIE_SECURE: "true"
      AUTH_INTERNAL_SERVICE_TOKEN_FILE: /run/secrets/auth_internal_service_token
      AUTH_MEDIA_SERVICE_URL: http://media-service:8080
      AUTH_MEDIA_SERVICE_TOKEN_FILE: /run/secrets/auth_media_service_token
      AUTH_PUSH_SERVICE_URL: http://push-service:8080
      AUTH_PUSH_SERVICE_TOKEN_FILE: /run/secrets/auth_push_service_token
    secrets:
      - auth_database_url
      - auth_internal_service_token
      - auth_media_service_token
      - auth_push_service_token
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/busybox", "sh", "-c", "/busybox wget -q -O /dev/null http://127.0.0.1:8080/health/live && /busybox wget -q -O /dev/null http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [backend]

  device-service:
    build:
      context: ./device-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL_FILE: /run/secrets/device_database_url
      MQTT_BROKER_URL: ssl://mosquitto:8883
      MQTT_ADVERTISED_BROKER_URL: ${MQTT_ADVERTISED_BROKER_URL:?set MQTT_ADVERTISED_BROKER_URL in project/src/services/.env}
      ATLAS_ACTIVATION_ORIGIN: ${ATLAS_ACTIVATION_ORIGIN:-}
      MQTT_CA_FILE: /run/secrets/mqtt_ca_certificate
      MQTT_ADMIN_USERNAME: admin
      MQTT_ADMIN_PASSWORD_FILE: /run/secrets/mqtt_admin_password
      MQTT_DEVICE_SERVICE_USERNAME: yunshao-device-service
      MQTT_DEVICE_SERVICE_PASSWORD_FILE: /run/secrets/mqtt_device_service_password
      DEVICE_INTERNAL_SERVICE_TOKEN_FILE: /run/secrets/device_internal_service_token
      MEDIA_SERVICE_INTERNAL_URL: http://media-service:8080
      MEDIA_SERVICE_INTERNAL_TOKEN_FILE: /run/secrets/device_media_service_token
    secrets:
      - device_database_url
      - mqtt_ca_certificate
      - mqtt_admin_password
      - mqtt_device_service_password
      - device_internal_service_token
      - device_media_service_token
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
      broker-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/busybox", "sh", "-c", "/busybox wget -q -O /dev/null http://127.0.0.1:8080/health/live && /busybox wget -q -O /dev/null http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [backend]

  event-service:
    build:
      context: ./event-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL_FILE: /run/secrets/event_database_url
      MQTT_BROKER_URL: ssl://mosquitto:8883
      MQTT_CA_FILE: /run/secrets/mqtt_ca_certificate
      MQTT_EVENT_SERVICE_USERNAME: yunshao-event-service
      MQTT_EVENT_SERVICE_PASSWORD_FILE: /run/secrets/mqtt_event_service_password
      DEVICE_SERVICE_INTERNAL_URL: http://device-service:8080
      DEVICE_SERVICE_INTERNAL_TOKEN_FILE: /run/secrets/device_internal_service_token
      PUSH_SERVICE_INTERNAL_URL: http://push-service:8080
      PUSH_SERVICE_INTERNAL_TOKEN_FILE: /run/secrets/event_push_service_token
      EVENT_CURSOR_SIGNING_KEY_FILE: /run/secrets/event_cursor_signing_key
      EVENT_EVIDENCE_DIR: /var/lib/yunshao/evidence
    secrets:
      - event_database_url
      - mqtt_ca_certificate
      - mqtt_event_service_password
      - device_internal_service_token
      - event_push_service_token
      - event_cursor_signing_key
    volumes:
      - event_evidence:/var/lib/yunshao/evidence
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
      broker-bootstrap:
        condition: service_completed_successfully
      device-service:
        condition: service_healthy
      push-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/busybox", "sh", "-c", "/busybox wget -q -O /dev/null http://127.0.0.1:8080/health/live && /busybox wget -q -O /dev/null http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [backend]

  media-service:
    build:
      context: ./media-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL_FILE: /run/secrets/media_database_url
      DEVICE_SERVICE_INTERNAL_URL: http://device-service:8080
      DEVICE_SERVICE_INTERNAL_TOKEN_FILE: /run/secrets/device_internal_service_token
      AUTH_SERVICE_INTERNAL_URL: http://auth-service:8080
      MEDIA_DEVICE_SERVICE_TOKEN_FILE: /run/secrets/device_media_service_token
      MEDIA_AUTH_SERVICE_TOKEN_FILE: /run/secrets/auth_media_service_token
      MEDIA_NGINX_INTERNAL_TOKEN_FILE: /run/secrets/media_nginx_internal_token
      MEDIAMTX_API_URL: http://host.docker.internal:9997
      MEDIAMTX_API_USERNAME: media-service
      MEDIAMTX_API_PASSWORD_FILE: /run/secrets/mediamtx_api_password
      MEDIA_SOURCE_ENCRYPTION_KEY_FILE: /run/secrets/media_source_encryption_key
      MEDIA_PUBLIC_BASE_URL: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in project/src/services/.env}
    secrets:
      - media_database_url
      - device_internal_service_token
      - device_media_service_token
      - auth_media_service_token
      - media_nginx_internal_token
      - mediamtx_api_password
      - media_source_encryption_key
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
      device-service:
        condition: service_healthy
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "/busybox", "sh", "-c", "/busybox wget -q -O /dev/null http://127.0.0.1:8080/health/live && /busybox wget -q -O /dev/null http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [backend]

  push-service:
    build:
      context: ./push-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL_FILE: /run/secrets/push_database_url
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in project/src/services/.env}
      PUSH_VAPID_PUBLIC_KEY_FILE: /run/secrets/push_vapid_public_key
      PUSH_VAPID_PRIVATE_KEY_FILE: /run/secrets/push_vapid_private_key
      PUSH_VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:ops@example.invalid}
      PUSH_ENCRYPTION_KEY_FILE: /run/secrets/push_encryption_key
      PUSH_AUTH_SERVICE_TOKEN_FILE: /run/secrets/auth_push_service_token
      PUSH_EVENT_SERVICE_TOKEN_FILE: /run/secrets/event_push_service_token
    secrets:
      - push_database_url
      - push_vapid_public_key
      - push_vapid_private_key
      - push_encryption_key
      - auth_push_service_token
      - event_push_service_token
    depends_on:
      database-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/busybox", "sh", "-c", "/busybox wget -q -O /dev/null http://127.0.0.1:8080/health/live && /busybox wget -q -O /dev/null http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [backend, push_egress]

volumes:
  postgres_data:
  mosquitto_data:
  event_evidence:

networks:
  backend:
    driver: bridge
    name: ${BACKEND_NETWORK:-yunshao_backend}
  push_egress:
    driver: bridge

secrets:
  postgres_admin_password:
    file: ./auth-service/.secret-postgres-admin-password
  auth_database_password:
    file: ./auth-service/.secret-database-password
  device_database_password:
    file: ./device-service/.secret-database-password
  event_database_password:
    file: ./event-service/.secret-database-password
  media_database_password:
    file: ./media-service/.secret-database-password
  push_database_password:
    file: ./push-service/.secret-database-password
  auth_database_url:
    file: ./auth-service/.secret-database-url
  device_database_url:
    file: ./device-service/.secret-database-url
  event_database_url:
    file: ./event-service/.secret-database-url
  media_database_url:
    file: ./media-service/.secret-database-url
  push_database_url:
    file: ./push-service/.secret-database-url
  auth_internal_service_token:
    file: ./auth-service/.secret-internal-service-token
  auth_media_service_token:
    file: ./auth-service/.secret-media-service-token
  auth_push_service_token:
    file: ./auth-service/.secret-push-service-token
  device_internal_service_token:
    file: ./device-service/.secret-internal-service-token
  device_media_service_token:
    file: ./device-service/.secret-media-service-token
  event_push_service_token:
    file: ./event-service/.secret-push-service-token
  media_nginx_internal_token:
    file: ./media-service/.secret-nginx-internal-token
  event_cursor_signing_key:
    file: ./event-service/.secret-cursor-signing-key
  media_source_encryption_key:
    file: ./media-service/.secret-source-encryption-key
  push_encryption_key:
    file: ./push-service/.secret-encryption-key
  push_vapid_public_key:
    file: ./push-service/.secret-vapid-public-key
  push_vapid_private_key:
    file: ./push-service/.secret-vapid-private-key
  mqtt_admin_password:
    file: ./device-service/.secret-mqtt-admin-password
  mqtt_device_service_password:
    file: ./device-service/.secret-mqtt-device-service-password
  mqtt_event_service_password:
    file: ./device-service/.secret-mqtt-event-service-password
  mqtt_ca_certificate:
    file: ./device-service/.secret-mqtt-ca-certificate.pem
  mqtt_tls_certificate:
    file: ./device-service/.secret-mqtt-tls-certificate.pem
  mqtt_tls_private_key:
    file: ./device-service/.secret-mqtt-tls-private-key.pem
  mosquitto_ctrl_options:
    file: ./device-service/.secret-mosquitto-ctrl.options
  mediamtx_api_password:
    file: ./media-service/.secret-mediamtx-api-password
