name: Architecture boundaries

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dependency-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Go and Atlas dependency boundaries
        run: python project/scripts/check_architecture.py
